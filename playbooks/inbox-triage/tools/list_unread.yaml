# Agent tool: list unread mail for one account.
#
# A stub that returns fixed messages so the showcase runs without mail
# credentials.  To make it real, replace the shell step with `kind: http`
# calls to the Gmail API (users.messages.list with q=is:unread, then
# users.messages.get per id), authenticated with an OAuth token for the
# account — one credential alias per mailbox.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: list_unread
workload:
  account: ""
workflow:
  - step: start
    next:
      - step: list
  - step: list
    tool:
      kind: shell
      cmds:
        - >-
          echo '[{"account":"{{ workload.account }}","from":"ci@example.com","subject":"Build failed on main","snippet":"Job test failed at 06:12"},
          {"account":"{{ workload.account }}","from":"alex@example.com","subject":"Contract review by Friday?","snippet":"Can you send comments on the draft by Friday?"},
          {"account":"{{ workload.account }}","from":"news@example.com","subject":"Weekly digest","snippet":"Top stories this week"}]'
