# Agent tool: unread inbox message ids for one Gmail account.
#
# Input (from the model): account — the short name; the credential alias is
# `gmail-<account>`, created with:
#   noetl credential google gmail-<account> --client-secret-file <client.json>
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: gmail_list_unread
workload:
  account: ""
  gmail_api: https://gmail.googleapis.com/gmail/v1
  # Primary tab only, last day: skips promotions, social and update mail,
  # which is most of the volume and needs no action.
  query: is:unread in:inbox category:primary newer_than:1d
  max_results: "15"
workflow:
  - step: start
    next:
      - step: list
  - step: list
    tool:
      kind: http
      method: GET
      url: "{{ workload.gmail_api }}/users/me/messages"
      params:
        q: "{{ workload.query }}"
        maxResults: "{{ workload.max_results }}"
      auth:
        type: google_oauth
        credential: "gmail-{{ workload.account }}"
    next:
      - step: compact
  # Ids plus Gmail's estimate of the total, nothing else.
  - step: compact
    tool:
      kind: rhai
      code: |
        let r = parse_json(list.result);
        if r.status != 200 {
          #{ error: r.status, detail: r.body }
        } else {
          let ids = [];
          if r.body.messages != () { for m in r.body.messages { ids.push(m.id); } }
          #{ ids: ids, more: r.body.nextPageToken != (), estimate: r.body.resultSizeEstimate }
        }
